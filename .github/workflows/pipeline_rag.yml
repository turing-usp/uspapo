name: USPapo Data Pipeline

on:
  schedule:
    # Roda diariamente às 05:00 UTC (02:00 da manhã no fuso BRT)
    - cron: '0 5 * * *'
  workflow_dispatch: # Cria um botão no GitHub para você rodar manualmente quando quiser

permissions:
  contents: write # Permite que o robô faça commit atualizando a data no JSON

jobs:
  rodar-orquestrador:
    runs-on: ubuntu-latest
    
    steps:
      - name: 📥 Clonar o repositório
        uses: actions/checkout@v4

      - name: 🐍 Configurar Python
        uses: actions/setup-python@v5
        with:
          python-version: '3.11' # O GitHub instala o Python bonitinho
          cache: 'pip' # Acelera as execuções futuras

      - name: 📦 Instalar dependências
        run: |
          python -m pip install --upgrade pip
          pip install -r requirements.txt

      - name: 🚀 Executar o Orquestrador (Scraping + Pinecone)
        env:
          # O script vai puxar essa variável dos Secrets do GitHub
          PINECONE_API_KEY: ${{ secrets.PINECONE_API_KEY }}
        run: python scripts/cron_pipeline_rag.py

      - name: 💾 Salvar nova data no scrapers_config.json e ledger atualizado
        run: |
          git config --global user.name "github-actions[bot]"
          git config --global user.email "github-actions[bot]@users.noreply.github.com"

          git add scrapers_config.json
          git add data/index/ledger_avancado.json
          git add data/processed/

          git commit -m "chore(dados): atualiza ledger e dados do pipeline [skip ci]" || echo "Nenhuma alteracao nas datas para commitar"
          git push